name: Backend checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tenantku_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate OpenAPI
        run: npx --yes openapi-typescript@7.13.0 api/openapi.yaml -o /tmp/tenantku-api.d.ts
      - name: Check auth migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in migrations/00001_auth.{up,down,up}.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d tenantku_test -v ON_ERROR_STOP=1 < "$migration"
          done
      - run: make check
        env:
          TENANTKU_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/tenantku_test?sslmode=disable
