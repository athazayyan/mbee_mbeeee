        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        author_side: {type: string, enum: [business, organization]}
        author_name: {type: string}
        event_name: {type: string}
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, maxLength: 2000}
        status: {type: string, enum: [published, hidden]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        edited: {type: boolean}
        editable_until: {type: string, format: date-time, description: Hanya untuk ulasan milik pihak pemanggil.}
        author_email: {type: string}
        business_name: {type: string}
        organization_name: {type: string}
        revisions: {type: integer, minimum: 0}
    ReviewModeration:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [hide, restore]}
        reason: {type: string, minLength: 1, maxLength: 500}
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, maxLength: 2000}
    Notification:
      type: object
      required: [id, kind, title, message, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [event_cancelled, booking_expired]}
        title: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        link: {type: string, description: Path internal aplikasi yang membuka detail terkait.}
        created_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time}
    PresignInput:
      type: object
      required: [purpose, content_type, size_bytes, owner_id]
      properties:
        purpose: {type: string, enum: [event_banner, product_photo, dispute_evidence]}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size_bytes: {type: integer, minimum: 1, maximum: 5242880}
        owner_id: {type: string, format: uuid, description: Usaha untuk product_photo, organisasi untuk event_banner.}
    UploadIntent:
      type: object
      required: [upload_id, url, method, headers, expires_at]
      properties:
        upload_id: {type: string, format: uuid}
        url: {type: string, format: uri}
        method: {type: string, enum: [PUT]}
        headers: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string, format: date-time}
    CompleteUploadInput:
      type: object
      required: [upload_id]
      properties:
        upload_id: {type: string, format: uuid}
    UploadStatus:
      type: object
      required: [upload_id, status]
      properties:
        upload_id: {type: string, format: uuid}
        status: {type: string, enum: [ready, rejected]}
        reason: {type: string, description: Alasan penolakan bila rejected.}
    AuditEvent:
      type: object
      required: [id, actor_id, actor_email, action, resource_type, reason, occurred_at, request_id]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        actor_email: {type: string, format: email}
        action: {type: string, minLength: 1}
        resource_type: {type: string, minLength: 1}
        resource_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1}
        before: {type: object, additionalProperties: true}
        after: {type: object, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
        request_id: {type: string, format: uuid}
    PlanCatalog:
      type: object
      required: [version_id, effective_at, custom_price_per_tenant, plans]
      properties:
        version_id: {type: integer}
        effective_at: {type: string, format: date-time}
        custom_price_per_tenant: {$ref: '#/components/schemas/Rupiah'}
        plans:
          type: array
          items: {$ref: '#/components/schemas/PlanQuote'}
    PlanQuote:
      type: object
      required: [code, name, capacity, price, price_per_tenant]
      properties:
        code: {type: string, description: Kode paket, atau custom di atas kapasitas terbesar.}
        name: {type: string}
        capacity: {type: integer, minimum: 1}
        price: {$ref: '#/components/schemas/Rupiah'}
        price_per_tenant: {$ref: '#/components/schemas/Rupiah'}
    AdminOverview:
      type: object
      required: [users, users_verified, businesses, organizations, organizations_unverified, events_draft, events_published,
        bookings_active, bookings_confirmed, sales_last_7_days, sales_revenue_last_7_days]
      properties:
        users: {type: integer}
        users_verified: {type: integer}
        businesses: {type: integer}
        organizations: {type: integer}
        organizations_unverified: {type: integer}
        events_draft: {type: integer}
        events_published: {type: integer}
        bookings_active: {type: integer}
        bookings_confirmed: {type: integer}
        sales_last_7_days: {type: integer}
        sales_revenue_last_7_days: {$ref: '#/components/schemas/Rupiah'}
    AdminOrganization:
      type: object
      required: [id, name, verification_status, created_at, owner_email, events_total, events_published]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        verification_status: {type: string, enum: [unverified, verified]}
        verified_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        owner_email: {type: string, format: email}
        events_total: {type: integer}
        events_published: {type: integer}
    VerificationInput:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: {type: string, enum: [verified, unverified]}
        reason: {type: string, minLength: 1, maxLength: 500}
    AdminUser:
      type: object
      required: [id, email, email_verified, created_at, businesses, organizations, admin]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        email_verified: {type: boolean}
        created_at: {type: string, format: date-time}
        businesses: {type: integer}
        organizations: {type: integer}
        admin: {type: boolean}
    PaymentException:
      type: object
      required: [id, payment_id, code, status, created_at]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        code: {type: string, minLength: 1}
        status: {type: string, enum: [open, investigating, closed]}
        created_at: {type: string, format: date-time}
    SettingInput:
      type: object
      required: [value, effective_at, reason]
      properties:
        value: {description: Nilai dengan skema yang ditentukan oleh key.}
        effective_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1}
    SettingVersion:
      type: object
      required: [key, version, effective_at]
      properties:
        key: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        effective_at: {type: string, format: date-time}
  parameters:
    IdentityResourceID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1}
      description: Cursor dari meta.next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: Gunakan key yang sama saat retry. Payload berbeda untuk key sama menghasilkan IDEMPOTENCY_PAYLOAD_MISMATCH.
    LayoutRevision:
      name: If-Match
      in: header
      required: false
      schema: {type: string, minLength: 1}
      description: ETag revisi denah terkini, misalnya "3". Boleh dikosongkan atau "0" hanya untuk revisi pertama.
tags:
- name: Akun dan sesi
  description: Akun, akses, profil usaha, dan persetujuan.
- name: Operasional
  description: Probes layanan di luar prefix /api/v1.
- name: Acara dan katalog
  description: Katalog published serta pengelolaan acara organisasi.
- name: Denah dan harga
  description: Denah terbit dan revisi harga oleh penyelenggara.
- name: Kurasi dan booking
  description: Pendaftaran, penawaran, inventori stand, dan snapshot booking.
- name: Pembayaran dan operasional dana
  description: Pembayaran, webhook, check-in, refund dan sengketa.
- name: Produk dan kasir
  description: Katalog, sesi kasir, transaksi dan sinkronisasi offline.
- name: Analisis
  description: Kalkulator impas dan agregat dengan batas privasi.
- name: Kontrak dan tagihan
  description: Kontrak sewa jangka panjang, versi, invoice dan pembayaran.
- name: Rapor usaha
  description: Generate rapor, status job, dan tautan berbagi terbatas.
- name: Pesan, ulasan, dan notifikasi
  description: Komunikasi sesuai membership serta inbox pemilik.
- name: Unggahan
  description: Upload intent, verifikasi konten dan penyelesaian.
- name: Admin
  description: Audit, pengecualian pembayaran dan konfigurasi berversi.
