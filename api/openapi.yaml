        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Konflik terhadap status atau data yang sudah tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: tenantku_access
    RefreshCookie:
      type: apiKey
      in: cookie
      name: tenantku_refresh
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Nama header ini placeholder. Format signature, nama header dan payload final mengikuti provider terpilih.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    HistoricalEvent:
      description: Catatan historis baru atau pengulangan idempoten
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: '#/components/schemas/HistoricalEvent'}
              meta: {$ref: '#/components/schemas/EmptyMeta'}
    EventRevision:
      description: Usulan revisi baru atau hasil pengulangan idempoten
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: '#/components/schemas/EventRevision'}
              meta: {$ref: '#/components/schemas/EmptyMeta'}
    AccountProfile:
      description: Akun aktif dan keanggotaan yang tersedia
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccountProfileResponse'}
    Account:
      description: Account details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountResponse'
    Error:
      description: API error. Mutations may return 403 if the browser origin is rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          description: Maximum 72 UTF-8 bytes.
    Account:
      type: object
      required:
      - id
      - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    AccountResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Account'
        meta:
          type: object
          additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - fields
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
              format: uuid
    Rupiah: {type: integer, minimum: 0, format: int64, description: Rupiah bulat tanpa pecahan.}
    BasisPoints: {type: integer, minimum: 0, maximum: 10000, description: 100 basis point sama dengan 1 persen.}
    EmptyMeta:
      type: object
      additionalProperties: false
    CursorMeta:
      type: object
      properties:
        next_cursor: {type: [string, 'null'], description: null bila tidak ada halaman berikutnya.}
    ResourceStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, minLength: 1}
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 1}
        password: {type: string, format: password, minLength: 12}
    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1}
    AccountProfileResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/AccountProfile'}
        meta: {$ref: '#/components/schemas/EmptyMeta'}
    AccountProfile:
      allOf:
      - {$ref: '#/components/schemas/Account'}
      - type: object
        required: [memberships]
        properties:
          memberships:
            type: array
            items: {$ref: '#/components/schemas/Membership'}
    Membership:
      type: object
      required: [subject_type, subject_id, name, role]
      properties:
        subject_type: {type: string, enum: [business, organization]}
        subject_id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string, enum: [owner, member]}
    BusinessCategory:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    BusinessCreate:
      type: object
      additionalProperties: false
      required: [name, category_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        category_id: {type: string, format: uuid}
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    Organization:
      type: object
      required: [id, name, verification_status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        verification_status: {type: string, enum: [unverified, verified]}
    Business:
      type: object
      required: [id, name, category_id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1}
        category_id: {type: string, format: uuid}
    BusinessUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        category_id: {type: string, format: uuid}
    ConsentInput:
      type: object
      additionalProperties: false
      required: [purpose, granted, policy_version]
      properties:
        purpose: {type: string, enum: [analytics]}
        granted: {type: boolean}
        policy_version: {type: string, enum: [analytics-v1]}
    ConsentEvent:
      type: object
      required: [id, business_id, purpose, granted, policy_version, created_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        purpose: {type: string, enum: [analytics]}
        granted: {type: boolean}
        policy_version: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
    ManagedEvent:
      type: object
      required: [id, organization_id, name, slug, status, starts_at, ends_at, timezone, city]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, published, live, completed, cancelled]}
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1}
        city: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        banner_upload_id: {type: string, format: uuid}
        facilities: {type: array, items: {type: string, minLength: 1}}
        terms: {type: string, minLength: 1}
    PublicEvent:
      type: object
      required: [id, organization_id, name, slug, status, starts_at, ends_at, timezone, city]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        status: {type: string, enum: [published, live, completed, cancelled]}
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1}
        city: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        facilities: {type: array, items: {type: string, minLength: 1}}
        terms: {type: string, minLength: 1}
        banner_url: {type: string, format: uri}
        min_rent: {$ref: '#/components/schemas/Rupiah'}
        max_rent: {$ref: '#/components/schemas/Rupiah'}
        capacity: {type: integer, minimum: 0}
    EventCreate:
      type: object
      additionalProperties: false
      required: [name, slug, starts_at, ends_at, timezone, city, address]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        city: {type: string, minLength: 1, maxLength: 120}
        address: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 3000}
        facilities: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 120}}
        terms: {type: string, maxLength: 6000}
    EventUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        city: {type: string, minLength: 1, maxLength: 120}
        address: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 3000}
        facilities: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 120}}
        terms: {type: string, maxLength: 6000}
    HistoricalEventInput:
      type: object
      additionalProperties: false
      required: [name, starts_at, ends_at, timezone, city, address]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        city: {type: string, minLength: 1, maxLength: 120}
        address: {type: string, minLength: 1, maxLength: 300}
    HistoricalEvent:
      type: object
      required: [id, organization_id, source, reported_at, name, starts_at, ends_at, timezone, city, address]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        source: {type: string, const: self-reported}
        reported_at: {type: string, format: date-time}
        name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string}
        city: {type: string}
        address: {type: string}
    EventRevisionInput:
      type: object
      additionalProperties: false
      required: [reason, changes]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            timezone: {type: string, minLength: 1, maxLength: 64}
            city: {type: string, minLength: 1, maxLength: 120}
            address: {type: string, minLength: 1, maxLength: 300}
            terms: {type: string, minLength: 1, maxLength: 6000}
    EventMaterialSnapshot:
      type: object
      required: [starts_at, ends_at, timezone, city, address, terms]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string}
        city: {type: string}
        address: {type: string}
        terms: {type: string}
    EventRevision:
      type: object
      required: [id, event_id, revision, requested_by, reason, before, after, affected_bookings, created_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        requested_by: {type: string, format: uuid}
        reason: {type: string}
        before: {$ref: '#/components/schemas/EventMaterialSnapshot'}
        after: {$ref: '#/components/schemas/EventMaterialSnapshot'}
        affected_bookings: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    StandLayout:
      type: object
      required: [stand_id, code, x, y, width, height, rotation]
      properties:
        stand_id: {type: string, format: uuid}
        block_id: {type: string, format: uuid}
        code: {type: string, minLength: 1}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        rotation: {type: integer, enum: [0, 90]}
        category_ids: {type: array, items: {type: string, format: uuid}}
        facilities: {type: array, items: {type: string, minLength: 1}}
        active: {type: boolean}
    LayoutBlock:
      type: object
      required: [id, label, x, y, width, height]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, minLength: 1}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    LayoutArea:
      type: object
      required: [kind, x, y, width, height]
      properties:
        kind: {type: string, enum: [walkway, entrance, stage, restricted]}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    LayoutRevision:
      type: object
      required: [event_id, revision, width, height, blocks, stands, areas]
      properties:
        event_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        blocks: {type: array, items: {$ref: '#/components/schemas/LayoutBlock'}}
        stands: {type: array, items: {$ref: '#/components/schemas/StandLayout'}}
        areas: {type: array, items: {$ref: '#/components/schemas/LayoutArea'}}
    LayoutRevisionInput:
      type: object
      required: [width, height, blocks, stands, areas]
      properties:
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        blocks: {type: array, items: {$ref: '#/components/schemas/LayoutBlock'}}
        stands: {type: array, items: {$ref: '#/components/schemas/StandLayout'}}
        areas: {type: array, items: {$ref: '#/components/schemas/LayoutArea'}}
    StandPrice:
      type: object
      required: [stand_id, base_price]
      properties:
        stand_id: {type: string, format: uuid}
        base_price: {$ref: '#/components/schemas/PricingRupiah'}
    BlockPrice:
      type: object
      required: [block_id, base_price]
      properties:
        block_id: {type: string, format: uuid}
        base_price: {$ref: '#/components/schemas/PricingRupiah'}
    OccupancyTier:
      type: object
      required: [occupancy_bps, multiplier_bps]
      properties:
        occupancy_bps: {$ref: '#/components/schemas/BasisPoints'}
        multiplier_bps: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
    CategoryQuota:
      type: object
      description: Satu batas per kategori untuk seluruh acara jika block_id kosong, atau untuk satu blok jika diisi. Jika keduanya ada, hold wajib memenuhi kedua batas tersebut.
      required: [category_id, cap]
      properties:
        category_id: {type: string, format: uuid}
        block_id: {type: string, format: uuid, description: Blok dengan stand aktif dalam denah acara.}
        cap: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
    PricingRupiah:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    SlotPrice:
      type: object
      required: [event_slot_id, base_price]
      properties:
        event_slot_id: {type: string, format: uuid}
        base_price: {$ref: '#/components/schemas/PricingRupiah'}
    PricingRules:
      type: object
      properties:
        default_base_price: {$ref: '#/components/schemas/PricingRupiah'}
        slot_prices: {type: array, items: {$ref: '#/components/schemas/SlotPrice'}}
        stand_prices: {type: array, items: {$ref: '#/components/schemas/StandPrice'}}
        block_prices: {type: array, items: {$ref: '#/components/schemas/BlockPrice'}}
        occupancy_tiers: {type: array, items: {$ref: '#/components/schemas/OccupancyTier'}}
        floor: {$ref: '#/components/schemas/PricingRupiah'}
        cap: {$ref: '#/components/schemas/PricingRupiah'}
        category_quotas: {type: array, items: {$ref: '#/components/schemas/CategoryQuota'}}
    PricingInput:
      allOf:
      - {$ref: '#/components/schemas/PricingRules'}
      - type: object
        properties:
          effective_at: {type: string, format: date-time}
    PricingVersion:
      type: object
      required: [event_id, price_version, effective_at, rules]
      properties:
        event_id: {type: string, format: uuid}
        price_version: {type: string, minLength: 1}
        effective_at: {type: string, format: date-time}
        rules: {$ref: '#/components/schemas/PricingRules'}
    PricingSlot:
      type: object
      required: [id, code, starts_at, ends_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    PricingState:
      type: object
      required: [slots, active, latest]
      properties:
        slots: {type: array, items: {$ref: '#/components/schemas/PricingSlot'}}
        inventory:
          type: object
          description: Pilihan harga dari denah yang terhubung. Field ini tersedia saat sumber inventori acara dikonfigurasi.
          required: [stands, blocks]
          properties:
            stands:
              type: array
              items:
                type: object
                required: [id, code, slot_ids]
                properties:
                  id: {type: string, format: uuid}
                  code: {type: string}
                  block_id: {type: string, format: uuid}
                  slot_ids: {type: array, items: {type: string, format: uuid}}
            blocks:
              type: array
              items:
                type: object
                required: [id, label]
                properties:
                  id: {type: string, format: uuid}
                  label: {type: string}
        active:
          oneOf:
          - {$ref: '#/components/schemas/PricingVersion'}
          - {type: 'null'}
        latest:
          oneOf:
          - {$ref: '#/components/schemas/PricingVersion'}
          - {type: 'null'}
    PricingPreviewInput:
      type: object
      required: [rules, event_slot_id, confirmed_count, capacity]
      properties:
        rules: {$ref: '#/components/schemas/PricingInput'}
        event_slot_id: {type: string, format: uuid}
        stand_id:
          type: string
          format: uuid
          description: Stand aktif pada slot yang dipilih untuk simulasi harga stand atau blok.
        confirmed_count: {type: integer, format: int32, minimum: 0, maximum: 2147483647}
        capacity: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
    PricingQuote:
      type: object
      required: [base_price, rent, occupancy_bps, multiplier_bps]
      properties:
        base_price: {$ref: '#/components/schemas/PricingRupiah'}
        rent: {$ref: '#/components/schemas/PricingRupiah'}
        occupancy_bps: {$ref: '#/components/schemas/BasisPoints'}
        multiplier_bps: {type: integer, format: int32, minimum: 1}
    Application:
      type: object
      required: [id, status, event_id, business_id]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        status: {type: string, enum: [submitted, approved, rejected, withdrawn, expired]}
        preferred_stand_ids: {type: array, items: {type: string, format: uuid}}
        reason: {type: string, minLength: 1}
    ApplicationInput:
      type: object
      required: [business_id]
      properties:
        business_id: {type: string, format: uuid}
        preferred_stand_ids: {type: array, items: {type: string, format: uuid}}
    ApproveApplicationInput:
      type: object
      required: [stand_id, event_slot_id]
      properties:
        stand_id: {type: string, format: uuid}
        event_slot_id: {type: string, format: uuid}
    ApplicationOffer:
      type: object
      required: [application_id, booking_id, expires_at]
      properties:
        application_id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    WaitlistInput:
      type: object
      required: [business_id]
      properties:
        business_id: {type: string, format: uuid}
        block_id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
    WaitlistEntry:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [waiting, offered, expired, closed]}
        position: {type: integer, minimum: 1}
    BookingPrice:
      type: object
      required: [currency, rent, platform_fee, provider_fee, total, price_version]
      properties:
        currency: {type: string, enum: [IDR]}
        rent: {$ref: '#/components/schemas/Rupiah'}
        platform_fee: {$ref: '#/components/schemas/Rupiah'}
        provider_fee: {$ref: '#/components/schemas/Rupiah'}
        total: {$ref: '#/components/schemas/Rupiah'}
        price_version: {type: string, minLength: 1}
    Booking:
      type: object
      required: [booking_id, status, expires_at, price]
      properties:
        booking_id: {type: string, format: uuid}
        status: {type: string, enum: [held, payment_pending, confirmed, expired, cancelled]}
        business_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        stand_id: {type: string, format: uuid}
        event_slot_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        price: {$ref: '#/components/schemas/BookingPrice'}
        accepted_policy_version: {type: string, minLength: 1}
    BookingDetail:
      allOf:
      - {$ref: '#/components/schemas/Booking'}
      - type: object
        required: [business_id, event_id, stand_id, event_slot_id, event_name, created_at, accepted_policy_version]
        properties:
          business_id: {type: string, format: uuid}
          event_id: {type: string, format: uuid}
          stand_id: {type: string, format: uuid}
          event_slot_id: {type: string, format: uuid}
          event_name: {type: string, minLength: 1}
          created_at: {type: string, format: date-time}
          accepted_policy_version: {type: string, minLength: 1}
    ServerTime:
      type: object
      required: [server_now]
      properties:
        server_now: {type: string, format: date-time}
    BookingWithServerTime:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/BookingDetail'}
        meta: {$ref: '#/components/schemas/ServerTime'}
    HoldSelection:
      type: object
      required: [business_id, event_id, stand_id, event_slot_id]
      properties:
        business_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        stand_id: {type: string, format: uuid}
        event_slot_id: {type: string, format: uuid}
    HoldInput:
      allOf:
      - {$ref: '#/components/schemas/HoldSelection'}
      - type: object
        required: [accepted_policy_version]
        properties:
          accepted_policy_version: {type: string, minLength: 1, maxLength: 80}
          expected_price:
            allOf:
            - {$ref: '#/components/schemas/BookingPrice'}
            description: Salin harga hasil quote untuk mendeteksi perubahan sebelum hold dibuat.
    HoldQuote:
      allOf:
      - {$ref: '#/components/schemas/HoldSelection'}
      - type: object
        required: [event_name, event_terms, refund_policy_version, refund_terms, price]
        properties:
          event_name: {type: string}
          event_terms: {type: string}
          refund_policy_version: {type: string}
          refund_terms: {type: string}
          price: {$ref: '#/components/schemas/BookingPrice'}
    PaymentInput:
      type: object
      required: [method]
      properties:
        method: {type: string, minLength: 1}
        description: {type: string, maxLength: 200}
    PaymentAttempt:
      type: object
      required: [id, status, amount, currency, provider]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [created, pending, paid, failed, expired]}
        amount: {$ref: '#/components/schemas/Rupiah'}
        currency: {type: string, enum: [IDR]}
        provider: {type: string, minLength: 1}
        checkout_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
