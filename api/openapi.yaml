        effective_at: {type: string, format: date-time}
    Application:
      type: object
      required: [id, status, event_id, business_id]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        status: {type: string, enum: [submitted, approved, rejected, withdrawn, expired]}
        preferred_stand_ids: {type: array, items: {type: string, format: uuid}}
        reason: {type: string, minLength: 1}
    ApplicationInput:
      type: object
      required: [business_id]
      properties:
        business_id: {type: string, format: uuid}
        preferred_stand_ids: {type: array, items: {type: string, format: uuid}}
    ApproveApplicationInput:
      type: object
      required: [stand_id, event_slot_id]
      properties:
        stand_id: {type: string, format: uuid}
        event_slot_id: {type: string, format: uuid}
    ApplicationOffer:
      type: object
      required: [application_id, booking_id, expires_at]
      properties:
        application_id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    WaitlistInput:
      type: object
      required: [business_id]
      properties:
        business_id: {type: string, format: uuid}
        block_id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
    WaitlistEntry:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [waiting, offered, expired, closed]}
        position: {type: integer, minimum: 1}
    BookingPrice:
      type: object
      required: [currency, rent, platform_fee, provider_fee, total, price_version]
      properties:
        currency: {type: string, enum: [IDR]}
        rent: {$ref: '#/components/schemas/Rupiah'}
        platform_fee: {$ref: '#/components/schemas/Rupiah'}
        provider_fee: {$ref: '#/components/schemas/Rupiah'}
        total: {$ref: '#/components/schemas/Rupiah'}
        price_version: {type: string, minLength: 1}
    Booking:
      type: object
      required: [booking_id, status, expires_at, price]
      properties:
        booking_id: {type: string, format: uuid}
        status: {type: string, enum: [held, payment_pending, confirmed, expired, cancelled]}
        business_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        stand_id: {type: string, format: uuid}
        event_slot_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        price: {$ref: '#/components/schemas/BookingPrice'}
        accepted_policy_version: {type: string, minLength: 1}
    HoldInput:
      type: object
      required: [business_id, event_id, stand_id, event_slot_id, accepted_policy_version]
      properties:
        business_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        stand_id: {type: string, format: uuid}
        event_slot_id: {type: string, format: uuid}
        accepted_policy_version: {type: string, minLength: 1}
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1}
      description: Cursor dari meta.next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: Gunakan key yang sama saat retry. Payload berbeda untuk key sama menghasilkan IDEMPOTENCY_PAYLOAD_MISMATCH.
    LayoutRevision:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: ETag revisi layout terkini, misalnya "3".
tags:
- name: Akun dan sesi
  description: Akun, akses, profil usaha, dan persetujuan.
- name: Operasional
  description: Probes layanan di luar prefix /api/v1.
- name: Acara dan katalog
  description: Katalog published serta pengelolaan acara organisasi.
- name: Denah dan harga
  description: Denah terbit dan revisi harga oleh penyelenggara.
- name: Kurasi dan booking
  description: Pendaftaran, penawaran, inventori stand, dan snapshot booking.
