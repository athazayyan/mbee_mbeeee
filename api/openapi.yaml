        p75_daily_sales: {$ref: '#/components/schemas/Rupiah'}
    BreakEvenInput:
      type: object
      required: [fixed_cost, unit_price, variable_cost_per_unit, estimated_units, selling_days]
      properties:
        fixed_cost: {$ref: '#/components/schemas/Rupiah'}
        unit_price: {type: integer, minimum: 1}
        variable_cost_per_unit: {$ref: '#/components/schemas/Rupiah'}
        estimated_units: {type: integer, minimum: 0}
        selling_days: {type: integer, minimum: 1}
    BreakEvenResult:
      type: object
      required: [status, contribution_margin, estimated_profit]
      properties:
        status: {type: string, enum: [reachable, unreachable]}
        contribution_margin: {type: integer}
        estimated_profit: {type: integer}
        units_at_break_even: {type: [integer, 'null'], minimum: 0}
        revenue_at_break_even: {type: [integer, 'null'], minimum: 0}
        daily_unit_target: {type: [integer, 'null'], minimum: 0}
    EventReport:
      type: object
      required: [event_id, confirmed_stands, active_stands]
      properties:
        event_id: {type: string, format: uuid}
        confirmed_stands: {type: integer, minimum: 0}
        active_stands: {type: integer, minimum: 0}
        occupancy_bps: {$ref: '#/components/schemas/BasisPoints'}
        cohort: {$ref: '#/components/schemas/Opportunity'}
    Contract:
      type: object
      required: [id, version, status, organization_id, business_id, unit_id, mode]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, pending, active, ended, cancelled]}
        organization_id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        unit_id: {type: string, format: uuid}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}
        timezone: {type: string, minLength: 1}
        mode: {type: string, enum: [fixed, revenue_share, hybrid]}
        fixed_rent: {$ref: '#/components/schemas/Rupiah'}
        revenue_share_bps: {$ref: '#/components/schemas/BasisPoints'}
        deposit: {$ref: '#/components/schemas/Rupiah'}
        terms: {type: string, minLength: 1}
    ContractInput:
      type: object
      required: [organization_id, business_id, unit_id, starts_on, ends_on, timezone, mode, terms]
      properties:
        organization_id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        unit_id: {type: string, format: uuid}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}
        timezone: {type: string, minLength: 1}
        mode: {type: string, enum: [fixed, revenue_share, hybrid]}
        fixed_rent: {$ref: '#/components/schemas/Rupiah'}
        revenue_share_bps: {$ref: '#/components/schemas/BasisPoints'}
        deposit: {$ref: '#/components/schemas/Rupiah'}
        terms: {type: string, minLength: 1}
    ContractAcceptance:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    Invoice:
      type: object
      required: [id, contract_id, status, period_start, period_end, total, due_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, unpaid, partially_paid, paid, overdue, void]}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        total: {$ref: '#/components/schemas/Rupiah'}
        due_at: {type: string, format: date-time}
        cutoff_at: {type: string, format: date-time}
    InvoicePaymentInput:
      type: object
      required: [method]
      properties:
        method: {type: string, minLength: 1}
        amount: {$ref: '#/components/schemas/Rupiah'}
    Job:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        report_id: {type: string, format: uuid}
        error_code: {type: string, minLength: 1}
    BusinessReportInput:
      type: object
      required: [period_start, period_end]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        event_id: {type: string, format: uuid}
    ReportShare:
      type: object
      required: [id, url, expires_at]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
    ReportShareInput:
      type: object
      properties:
        expires_at: {type: string, format: date-time}
        scope: {type: string, enum: [summary]}
    PublicReport:
      type: object
      required: [period_start, period_end, generated_at, verification_status]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        verification_status: {type: string, enum: [third_party_unverified]}
        net_sales: {$ref: '#/components/schemas/Rupiah'}
        transaction_count: {type: integer, minimum: 0}
        completeness_note: {type: string, minLength: 1}
    Message:
      type: object
      required: [id, client_message_id, sender_id, text, created_at]
      properties:
        id: {type: string, format: uuid}
        client_message_id: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 4000}
        sender_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    MessageInput:
      type: object
      required: [client_message_id, text]
      properties:
        client_message_id: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 4000}
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string, maxLength: 2000}
    Notification:
      type: object
      required: [id, kind, title, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time}
    PresignInput:
      type: object
      required: [purpose, content_type, size_bytes]
      properties:
        purpose: {type: string, enum: [event_banner, product_photo, dispute_evidence]}
        content_type: {type: string, minLength: 1}
        size_bytes: {type: integer, minimum: 1}
    UploadIntent:
      type: object
      required: [upload_id, url, method, headers, expires_at]
      properties:
        upload_id: {type: string, format: uuid}
        url: {type: string, format: uri}
        method: {type: string, enum: [PUT]}
        headers: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string, format: date-time}
    CompleteUploadInput:
      type: object
      required: [upload_id]
      properties:
        upload_id: {type: string, format: uuid}
    UploadStatus:
      type: object
      required: [upload_id, status]
      properties:
        upload_id: {type: string, format: uuid}
        status: {type: string, enum: [pending_scan, ready, rejected]}
    AuditEvent:
      type: object
      required: [id, action, occurred_at, request_id]
      properties:
        id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        action: {type: string, minLength: 1}
        resource_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1}
        occurred_at: {type: string, format: date-time}
        request_id: {type: string, format: uuid}
    PaymentException:
      type: object
      required: [id, payment_id, code, status, created_at]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        code: {type: string, minLength: 1}
        status: {type: string, enum: [open, investigating, closed]}
        created_at: {type: string, format: date-time}
    SettingInput:
      type: object
      required: [value, effective_at, reason]
      properties:
        value: {description: Nilai dengan skema yang ditentukan oleh key.}
        effective_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1}
    SettingVersion:
      type: object
      required: [key, version, effective_at]
      properties:
        key: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        effective_at: {type: string, format: date-time}
  parameters:
    IdentityResourceID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1}
      description: Cursor dari meta.next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: Gunakan key yang sama saat retry. Payload berbeda untuk key sama menghasilkan IDEMPOTENCY_PAYLOAD_MISMATCH.
    LayoutRevision:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: ETag revisi layout terkini, misalnya "3".
tags:
- name: Akun dan sesi
  description: Akun, akses, profil usaha, dan persetujuan.
- name: Operasional
  description: Probes layanan di luar prefix /api/v1.
- name: Acara dan katalog
  description: Katalog published serta pengelolaan acara organisasi.
- name: Denah dan harga
  description: Denah terbit dan revisi harga oleh penyelenggara.
- name: Kurasi dan booking
  description: Pendaftaran, penawaran, inventori stand, dan snapshot booking.
- name: Pembayaran dan operasional dana
  description: Pembayaran, webhook, check-in, refund dan sengketa.
- name: Produk dan kasir
  description: Katalog, sesi kasir, transaksi dan sinkronisasi offline.
- name: Analisis
  description: Kalkulator impas dan agregat dengan batas privasi.
- name: Kontrak dan tagihan
  description: Kontrak sewa jangka panjang, versi, invoice dan pembayaran.
- name: Rapor usaha
  description: Generate rapor, status job, dan tautan berbagi terbatas.
- name: Pesan, ulasan, dan notifikasi
  description: Komunikasi sesuai membership serta inbox pemilik.
- name: Unggahan
  description: Upload intent, verifikasi konten dan penyelesaian.
- name: Admin
  description: Audit, pengecualian pembayaran dan konfigurasi berversi.
