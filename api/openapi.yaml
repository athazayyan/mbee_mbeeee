        items: {type: array, items: {$ref: '#/components/schemas/AdjustmentItem'}}
    ExpenseInput:
      type: object
      required: [amount, category, occurred_at]
      properties:
        amount: {$ref: '#/components/schemas/Rupiah'}
        category: {type: string, minLength: 1}
        occurred_at: {type: string, format: date-time}
