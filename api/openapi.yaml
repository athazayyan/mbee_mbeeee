            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/SyncResult'}
                  meta: {$ref: '#/components/schemas/SyncMeta'}
              example:
                data:
                  results:
                  - sale_id: 10101010-1010-4010-8010-000000000010
                    status: accepted
                    server_id: 10101010-1010-4010-8010-000000000020
                  - sale_id: 10101010-1010-4010-8010-000000000011
                    status: duplicate
                    server_id: 10101010-1010-4010-8010-000000000021
                  - sale_id: 10101010-1010-4010-8010-000000000012
                    status: rejected
                    code: INVALID_TOTAL
                meta:
                  server_time: '2026-12-01T04:00:00Z'
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
