        status: {type: string, enum: [open, closed]}
    SaleItem:
      type: object
      required: [product_id, product_name, quantity, unit_price, subtotal]
      properties:
        product_id: {type: string, format: uuid}
        product_name: {type: string, minLength: 1}
        quantity: {type: integer, minimum: 1}
        unit_price: {$ref: '#/components/schemas/Rupiah'}
        unit_cost: {$ref: '#/components/schemas/Rupiah'}
        discount: {$ref: '#/components/schemas/Rupiah'}
        subtotal: {$ref: '#/components/schemas/Rupiah'}
    SaleInput:
      type: object
      required: [sale_id, device_id, business_id, session_id, client_created_at, schema_version, payload_hash, items, currency,
        method, total]
      properties:
        sale_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        client_created_at: {type: string, format: date-time}
        schema_version: {type: integer, minimum: 1}
        payload_hash: {type: string, minLength: 1}
        items: {type: array, items: {$ref: '#/components/schemas/SaleItem'}, minItems: 1}
        currency: {type: string, enum: [IDR]}
        method: {type: string, enum: [cash, external]}
        discount: {$ref: '#/components/schemas/Rupiah'}
        total: {$ref: '#/components/schemas/Rupiah'}
    Sale:
      type: object
      required: [id, sale_id, business_id, client_created_at, received_at, items, total, currency, method]
      properties:
        id: {type: string, format: uuid}
        received_at: {type: string, format: date-time}
        sale_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        client_created_at: {type: string, format: date-time}
        schema_version: {type: integer, minimum: 1}
        payload_hash: {type: string, minLength: 1}
        items: {type: array, items: {$ref: '#/components/schemas/SaleItem'}, minItems: 1}
        currency: {type: string, enum: [IDR]}
        method: {type: string, enum: [cash, external]}
        discount: {$ref: '#/components/schemas/Rupiah'}
        total: {$ref: '#/components/schemas/Rupiah'}
    SyncSucceeded:
      type: object
      required: [sale_id, status, server_id]
      properties:
        sale_id: {type: string, format: uuid}
        status: {type: string, enum: [accepted, duplicate]}
        server_id: {type: string, format: uuid}
    SyncFailed:
      type: object
      required: [sale_id, status, code]
      properties:
        sale_id: {type: string, format: uuid}
        status: {type: string, enum: [rejected, retryable]}
        code: {type: string, minLength: 1}
    SyncResult:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {oneOf: [{$ref: '#/components/schemas/SyncSucceeded'}, {$ref: '#/components/schemas/SyncFailed'}]}}
    SyncMeta:
      type: object
      required: [server_time]
      properties:
        server_time: {type: string, format: date-time}
    SalesBatch:
      type: object
      required: [sales]
      properties:
        sales: {type: array, items: {$ref: '#/components/schemas/SaleInput'}, minItems: 1, maxItems: 100}
    AdjustmentItem:
      type: object
      required: [sale_item_id, quantity]
      properties:
        sale_item_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
    SaleAdjustmentInput:
      type: object
      required: [type, reason]
      properties:
        type: {type: string, enum: [void, return]}
