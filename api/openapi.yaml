openapi: 3.1.0
info:
  title: TenantKu API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Account'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: login
      summary: Start a session and set access and refresh cookies
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate session cookies
      security:
        - RefreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear cookies
      responses:
        '204':
          description: The session has ended or was already absent
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getCurrentAccount
      summary: Read the signed-in account
      security:
        - AccessCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: tenantku_access
    RefreshCookie:
      type: apiKey
      in: cookie
      name: tenantku_refresh
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    Account:
      description: Account details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountResponse'
    Error:
      description: API error. Mutations may return 403 if the browser origin is rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          description: Maximum 72 UTF-8 bytes.
    Account:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    AccountResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Account'
        meta:
          type: object
          additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
              format: uuid
