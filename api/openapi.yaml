openapi: 3.1.0
info:
  title: TenantKu API
  version: 0.1.0
  description: Kontrak HTTP TenantKu mengikuti PRD §14. Endpoint [Rencana] sudah memiliki rancangan kontrak untuk review FE dan
    BE. Detail berlabel usulan dapat berubah sebelum implementasi. Endpoint operasional dan akun yang tersedia ditandai terimplementasi.
    Mutasi akun dari browser wajib berasal dari APP_ORIGIN; gunakan origin yang sama jika mencoba mutasi lewat Scalar pada lingkungan
    pengembangan.
servers:
- url: /api/v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Account'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
  /auth/login:
    post:
      operationId: login
      summary: Start a session and set access and refresh cookies
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: Akun dan cookie sesi
          headers:
            Set-Cookie:
              description: Dua header terpisah untuk tenantku_access dan tenantku_refresh.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
      description: Berhasil mengirim dua cookie host-only HttpOnly. Cookie dikirim menggunakan Secure pada origin HTTPS.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate session cookies
      security:
      - RefreshCookie: []
      responses:
        '200':
          description: Akun dan cookie sesi
          headers:
            Set-Cookie:
              description: Dua header terpisah untuk tenantku_access dan tenantku_refresh.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
      description: Berhasil mengirim dua cookie host-only HttpOnly. Cookie dikirim menggunakan Secure pada origin HTTPS.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear cookies
      responses:
        '204':
          description: The session has ended or was already absent
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
  /me:
    get:
      operationId: getCurrentAccount
      summary: Read the signed-in account
      security:
      - AccessCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
      description: Saat ini mengembalikan id dan email. Profil tambahan dan daftar membership direncanakan.
  /healthz:
    get:
      tags: [Operasional]
      operationId: getLiveness
      summary: Periksa liveness
      description: Status layanan untuk pemeriksaan operasional.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Periksa liveness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
      servers:
      - url: /
  /readyz:
    get:
      tags: [Operasional]
      operationId: getReadiness
      summary: Periksa readiness
      description: Status layanan untuk pemeriksaan operasional.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Periksa readiness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ready]}
        '503':
          description: PostgreSQL atau migration belum siap
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [unavailable]}
      servers:
      - url: /
  /auth/forgot-password:
    post:
      tags: [Akun dan sesi]
      operationId: requestPasswordReset
      summary: '[Rencana] Minta reset kata sandi'
      description: Terima request tanpa membedakan apakah email terdaftar.
      x-implementation-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordInput'}
      responses:
        '202':
          description: Berhasil tanpa isi respons
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas percobaan terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /auth/reset-password:
    post:
      tags: [Akun dan sesi]
      operationId: resetPassword
      summary: '[Rencana] Atur ulang kata sandi'
      description: Token sekali pakai dan memiliki masa berlaku.
      x-implementation-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordInput'}
      responses:
        '204':
          description: Berhasil tanpa isi respons
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas percobaan terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /businesses/{id}:
    patch:
      tags: [Akun dan sesi]
      operationId: updateBusiness
      summary: '[Rencana] Ubah profil usaha'
      description: Hanya pemilik usaha.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessUpdate'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Business'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /businesses/{id}/consents:
    post:
      tags: [Akun dan sesi]
      operationId: recordConsent
      summary: '[Rencana] Catat persetujuan data'
      description: Pemilik usaha. Grant dan revoke membuat entri audit baru.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentInput'}
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ConsentEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events:
    get:
      tags: [Acara dan katalog]
      operationId: listEvents
      summary: '[Rencana] Daftar acara publik'
      description: Katalog published/live. Filter slug merupakan pencocokan persis.
      x-implementation-status: planned
      security: []
      parameters:
      - name: slug
        in: query
        required: false
        schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
      - name: city
        in: query
        required: false
        schema: {type: string, minLength: 1}
      - name: category_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: starts_from
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: ends_before
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: status
        in: query
        required: false
        schema: {type: string, enum: [published, live]}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PublicEvent'}}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}:
    get:
      tags: [Acara dan katalog]
      operationId: getEvent
      summary: '[Rencana] Detail acara publik'
      description: Draft dan data privat tidak ikut dipublikasikan.
      x-implementation-status: planned
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/PublicEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Acara dan katalog]
      operationId: updateEvent
      summary: '[Rencana] Ubah acara'
      description: Pemilik acara. Perubahan material setelah booking memerlukan alur revisi.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdate'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ManagedEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Konflik terhadap status atau data yang sudah tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /organizations/{id}/events:
    post:
      tags: [Acara dan katalog]
      operationId: createEvent
      summary: '[Rencana] Buat draft acara'
      description: Hanya pengelola organisasi.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreate'}
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ManagedEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Konflik terhadap status atau data yang sudah tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}/publish:
    post:
      tags: [Acara dan katalog]
      operationId: publishEvent
      summary: '[Rencana] Terbitkan acara'
      description: Denah, harga dan syarat harus valid.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ManagedEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Konflik terhadap status atau data yang sudah tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}/cancel:
    post:
      tags: [Acara dan katalog]
      operationId: cancelEvent
      summary: '[Rencana] Batalkan acara'
      description: Pemilik atau admin berizin. Hentikan hold baru dan jadwalkan refund yang memenuhi kebijakan.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ManagedEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '400':
          description: Request atau header tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Konflik terhadap status atau data yang sudah tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}/layout:
    get:
      tags: [Denah dan harga]
      operationId: getPublicLayout
      summary: '[Rencana] Baca denah publik'
      description: Denah hanya memuat informasi yang boleh dilihat publik.
      x-implementation-status: planned
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/LayoutRevision'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
          headers:
            ETag:
              description: ETag revisi denah untuk If-Match.
              schema: {type: string, minLength: 1}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Denah dan harga]
      operationId: replaceLayout
      summary: '[Rencana] Simpan revisi denah penuh'
      description: Pemilik acara. Validasi batas grid, tumpang tindih dan booking aktif.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/LayoutRevision'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LayoutRevisionInput'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/LayoutRevision'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
          headers:
            ETag:
              description: ETag revisi denah untuk If-Match.
              schema: {type: string, minLength: 1}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: LAYOUT_REVISION_CONFLICT atau perubahan material terhadap stand terpesan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}/pricing:
    put:
      tags: [Denah dan harga]
      operationId: replacePricing
      summary: '[Rencana] Tetapkan versi aturan harga'
      description: Tier memakai okupansi confirmed. Harga hold aktif tetap memakai snapshot.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PricingInput'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/PricingVersion'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
