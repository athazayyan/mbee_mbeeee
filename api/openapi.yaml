        payment_id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        code: {type: string, minLength: 1}
        status: {type: string, enum: [open, investigating, closed]}
        created_at: {type: string, format: date-time}
    SettingInput:
      type: object
      required: [value, effective_at, reason]
      properties:
        value: {description: Nilai dengan skema yang ditentukan oleh key.}
        effective_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1}
    SettingVersion:
      type: object
      required: [key, version, effective_at]
      properties:
        key: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        effective_at: {type: string, format: date-time}
  parameters:
    IdentityResourceID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, minLength: 1}
      description: Cursor dari meta.next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
      description: Gunakan key yang sama saat retry. Payload berbeda untuk key sama menghasilkan IDEMPOTENCY_PAYLOAD_MISMATCH.
    LayoutRevision:
      name: If-Match
      in: header
      required: false
      schema: {type: string, minLength: 1}
      description: ETag revisi denah terkini, misalnya "3". Boleh dikosongkan atau "0" hanya untuk revisi pertama.
tags:
- name: Akun dan sesi
  description: Akun, akses, profil usaha, dan persetujuan.
- name: Operasional
  description: Probes layanan di luar prefix /api/v1.
- name: Acara dan katalog
  description: Katalog published serta pengelolaan acara organisasi.
- name: Denah dan harga
  description: Denah terbit dan revisi harga oleh penyelenggara.
- name: Kurasi dan booking
  description: Pendaftaran, penawaran, inventori stand, dan snapshot booking.
- name: Pembayaran dan operasional dana
  description: Pembayaran, webhook, check-in, refund dan sengketa.
- name: Produk dan kasir
  description: Katalog, sesi kasir, transaksi dan sinkronisasi offline.
- name: Analisis
  description: Kalkulator impas dan agregat dengan batas privasi.
- name: Kontrak dan tagihan
  description: Kontrak sewa jangka panjang, versi, invoice dan pembayaran.
- name: Rapor usaha
  description: Generate rapor, status job, dan tautan berbagi terbatas.
- name: Pesan, ulasan, dan notifikasi
  description: Komunikasi sesuai membership serta inbox pemilik.
- name: Unggahan
  description: Upload intent, verifikasi konten dan penyelesaian.
- name: Admin
  description: Audit, pengecualian pembayaran dan konfigurasi berversi.
