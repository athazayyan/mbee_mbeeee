        business_id: {type: string, format: uuid}
        name: {type: string, minLength: 1}
        sku: {type: string, minLength: 1}
        price: {$ref: '#/components/schemas/Rupiah'}
        cost: {$ref: '#/components/schemas/Rupiah'}
        category_id: {type: string, format: uuid}
        photo_upload_id: {type: string, format: uuid}
        stock: {type: integer}
        archived_at: {type: string, format: date-time}
    ProductCreate:
      type: object
      required: [name, price]
      properties:
        name: {type: string, minLength: 1}
        sku: {type: string, minLength: 1}
        price: {$ref: '#/components/schemas/Rupiah'}
        cost: {$ref: '#/components/schemas/Rupiah'}
        category_id: {type: string, format: uuid}
        photo_upload_id: {type: string, format: uuid}
        initial_stock: {type: integer, minimum: 0}
    ProductUpdate:
      type: object
