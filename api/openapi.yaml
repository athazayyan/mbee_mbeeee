    post:
      tags: [Produk dan kasir]
      operationId: syncSales
      summary: Sinkronkan transaksi kasir
      description: Semua anggota usaha. Tiap transaksi diproses dalam transaksi database sendiri dan HTTP 200 membawa
        hasil per item. Dedupe per usaha dan sale_id memakai sidik kanonik buatan server; ID sama dengan isi berbeda
        menghasilkan SYNC_PAYLOAD_CONFLICT. Server menghitung ulang subtotal (quantity x unit_price - discount) dan
        total (jumlah subtotal - discount). Stok produk dikurangi lewat mutasi 'sale' dan boleh menjadi negatif.
        Kode rejected - INVALID_SALE, INVALID_ITEMS, INVALID_TOTAL, INVALID_TIMESTAMP (lebih dari 24 jam di masa depan),
        UNSUPPORTED_SCHEMA_VERSION, BUSINESS_FORBIDDEN, UNKNOWN_SESSION, UNKNOWN_DEVICE, UNKNOWN_EVENT,
        UNKNOWN_PRODUCT, SYNC_PAYLOAD_CONFLICT. retryable berarti kirim ulang nanti tanpa mengubah isi; kode
        DEVICE_REVOKED berarti perangkat dicabut pemilik - simpan transaksi dan kirim lagi setelah dipulihkan. Body di atas 1 MiB ditolak 413.
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SalesBatch'}
      responses:
