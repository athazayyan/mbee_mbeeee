              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /admin/payment-exceptions:
    get:
      tags: [Admin]
      operationId: listPaymentExceptions
      summary: '[Rencana] Baca pengecualian pembayaran'
      description: 'Admin berizin. Contoh: pembayaran masuk setelah hold berakhir.'
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: status
        in: query
        required: false
        schema: {type: string, enum: [open, investigating, closed]}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PaymentException'}}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /admin/settings/{key}:
    put:
      tags: [Admin]
      operationId: publishSettingVersion
      summary: '[Rencana] Tetapkan versi konfigurasi'
      description: Admin berizin. Skema value mengikuti setting yang diizinkan. Perubahan finansial berlaku prospektif.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - name: key
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingInput'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/SettingVersion'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '400':
          description: Request atau header tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Konflik terhadap status atau data yang sudah tersimpan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: tenantku_access
    RefreshCookie:
      type: apiKey
      in: cookie
      name: tenantku_refresh
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Nama header ini placeholder. Format signature, nama header dan payload final mengikuti provider terpilih.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    HistoricalEvent:
      description: Catatan historis baru atau pengulangan idempoten
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: '#/components/schemas/HistoricalEvent'}
              meta: {$ref: '#/components/schemas/EmptyMeta'}
    EventRevision:
      description: Usulan revisi baru atau hasil pengulangan idempoten
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: '#/components/schemas/EventRevision'}
              meta: {$ref: '#/components/schemas/EmptyMeta'}
    AccountProfile:
      description: Akun aktif dan keanggotaan yang tersedia
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AccountProfileResponse'}
    Account:
      description: Account details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountResponse'
    Error:
      description: API error. Mutations may return 403 if the browser origin is rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          description: Maximum 72 UTF-8 bytes.
    SignupProfile:
      type: object
      additionalProperties: false
      required: [role, phone]
      properties:
        role: {type: string, enum: [tenant, organizer]}
        phone: {type: string, description: 'Nomor HP Indonesia, boleh diawali 08, 62, atau +62. Disimpan sebagai +62.'}
        business_name: {type: string, minLength: 1, maxLength: 120, description: Wajib untuk tenant.}
        category_id: {type: string, format: uuid, description: Wajib untuk tenant.}
        organization_name: {type: string, minLength: 1, maxLength: 120, description: Wajib untuk penyelenggara.}
        event_name: {type: string, minLength: 1, maxLength: 160, description: Wajib untuk penyelenggara. Hanya nama rencana acara pertama; acara dibuat setelah masuk.}
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 12, description: Maximum 72 UTF-8 bytes.}
        profile: {$ref: '#/components/schemas/SignupProfile'}
    Account:
      type: object
      required:
      - id
      - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    AccountResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Account'
        meta:
          type: object
          additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - fields
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
              format: uuid
    Rupiah: {type: integer, minimum: 0, format: int64, description: Rupiah bulat tanpa pecahan.}
    BasisPoints: {type: integer, minimum: 0, maximum: 10000, description: 100 basis point sama dengan 1 persen.}
    EmptyMeta:
      type: object
      additionalProperties: false
    CursorMeta:
      type: object
      properties:
        next_cursor: {type: [string, 'null'], description: null bila tidak ada halaman berikutnya.}
    ResourceStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, minLength: 1}
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1}
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 1}
        password: {type: string, format: password, minLength: 12}
    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1}
    AccountProfileResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/AccountProfile'}
        meta: {$ref: '#/components/schemas/EmptyMeta'}
    AccountProfile:
      allOf:
      - {$ref: '#/components/schemas/Account'}
      - type: object
        required: [memberships, roles]
        properties:
          memberships:
            type: array
            items: {$ref: '#/components/schemas/Membership'}
          phone: {type: string, description: Nomor HP dari pendaftaran, bila ada.}
          planned_event_name: {type: string, description: Nama acara pertama yang diisi penyelenggara saat mendaftar.}
          roles:
            type: array
            description: Peran untuk menu app. tenant bila punya usaha, organizer bila anggota organisasi, admin bila
              admin platform. Hak akses tetap diperiksa di tiap endpoint.
            items: {type: string, enum: [tenant, organizer, admin]}
    Membership:
      type: object
      required: [subject_type, subject_id, name, role]
      properties:
        subject_type: {type: string, enum: [business, organization]}
        subject_id: {type: string, format: uuid}
        name: {type: string}
        role: {type: string, enum: [owner, member]}
    BusinessCategory:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    BusinessCreate:
      type: object
      additionalProperties: false
      required: [name, category_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        category_id: {type: string, format: uuid}
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    Organization:
      type: object
      required: [id, name, verification_status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        verification_status: {type: string, enum: [unverified, verified]}
    Business:
      type: object
      required: [id, name, category_id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1}
        category_id: {type: string, format: uuid}
    BusinessUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        category_id: {type: string, format: uuid}
    ConsentInput:
      type: object
      additionalProperties: false
      required: [purpose, granted, policy_version]
      properties:
        purpose: {type: string, enum: [analytics]}
        granted: {type: boolean}
        policy_version: {type: string, enum: [analytics-v1]}
    ConsentEvent:
      type: object
      required: [id, business_id, purpose, granted, policy_version, created_at]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        purpose: {type: string, enum: [analytics]}
        granted: {type: boolean}
        policy_version: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
    ManagedEvent:
      type: object
      required: [id, organization_id, name, slug, status, starts_at, ends_at, timezone, city]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        status: {type: string, enum: [draft, published, live, completed, cancelled]}
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1}
        city: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        banner_upload_id: {type: string, format: uuid}
        facilities: {type: array, items: {type: string, minLength: 1}}
        terms: {type: string, minLength: 1}
    PublicEvent:
      type: object
      required: [id, organization_id, organization_name, name, slug, status, starts_at, ends_at, timezone, city]
      properties:
        id: {type: string, format: uuid}
        organization_name: {type: string, minLength: 1}
        organization_id: {type: string, format: uuid}
        status: {type: string, enum: [published, live, completed, cancelled]}
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1}
        city: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        facilities: {type: array, items: {type: string, minLength: 1}}
        terms: {type: string, minLength: 1}
        banner_url: {type: string, format: uri}
        min_rent: {$ref: '#/components/schemas/Rupiah'}
        max_rent: {$ref: '#/components/schemas/Rupiah'}
        capacity: {type: integer, minimum: 0, description: Jumlah stand aktif di denah; tidak ada bila acara belum punya denah.}
        slots:
          type: array
          description: Hanya pada GET /events/{id}. Tenant memilih slot sebelum meminta hold.
          items:
            type: object
            required: [id, code, starts_at, ends_at]
            properties:
              id: {type: string, format: uuid}
              code: {type: string, minLength: 1}
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
    EventCreate:
      type: object
      additionalProperties: false
      required: [name, slug, starts_at, ends_at, timezone, city, address]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        city: {type: string, minLength: 1, maxLength: 120}
        address: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 3000}
        facilities: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 120}}
        terms: {type: string, maxLength: 6000}
    EventUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        city: {type: string, minLength: 1, maxLength: 120}
        address: {type: string, minLength: 1, maxLength: 300}
        description: {type: string, maxLength: 3000}
        facilities: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 120}}
        terms: {type: string, maxLength: 6000}
    HistoricalEventInput:
      type: object
      additionalProperties: false
      required: [name, starts_at, ends_at, timezone, city, address]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string, minLength: 1, maxLength: 64}
        city: {type: string, minLength: 1, maxLength: 120}
        address: {type: string, minLength: 1, maxLength: 300}
    HistoricalEvent:
      type: object
      required: [id, organization_id, source, reported_at, name, starts_at, ends_at, timezone, city, address]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        source: {type: string, const: self-reported}
        reported_at: {type: string, format: date-time}
        name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string}
        city: {type: string}
        address: {type: string}
    EventRevisionInput:
      type: object
      additionalProperties: false
      required: [reason, changes]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            starts_at: {type: string, format: date-time}
            ends_at: {type: string, format: date-time}
            timezone: {type: string, minLength: 1, maxLength: 64}
            city: {type: string, minLength: 1, maxLength: 120}
            address: {type: string, minLength: 1, maxLength: 300}
            terms: {type: string, minLength: 1, maxLength: 6000}
    EventMaterialSnapshot:
      type: object
      required: [starts_at, ends_at, timezone, city, address, terms]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        timezone: {type: string}
        city: {type: string}
        address: {type: string}
        terms: {type: string}
    EventRevision:
      type: object
      required: [id, event_id, revision, requested_by, reason, before, after, affected_bookings, approved_bookings, declined_bookings, created_at, status, can_apply, applied_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        requested_by: {type: string, format: uuid}
        reason: {type: string}
        before: {$ref: '#/components/schemas/EventMaterialSnapshot'}
        after: {$ref: '#/components/schemas/EventMaterialSnapshot'}
        affected_bookings: {type: integer, minimum: 1}
        approved_bookings: {type: integer, minimum: 0}
        declined_bookings: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/EventRevisionStatus'}
        can_apply: {type: boolean}
        applied_at: {type: [string, 'null'], format: date-time}
    BookingEventRevision:
      type: object
      required: [id, revision, before, after, created_at, decision, decided_at, can_decide, status]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        before: {$ref: '#/components/schemas/EventMaterialSnapshot'}
        after: {$ref: '#/components/schemas/EventMaterialSnapshot'}
        created_at: {type: string, format: date-time}
        decision:
          anyOf:
          - {$ref: '#/components/schemas/EventRevisionDecisionChoice'}
          - {type: 'null'}
        decided_at: {type: [string, 'null'], format: date-time}
        can_decide: {type: boolean}
        status: {$ref: '#/components/schemas/EventRevisionStatus'}
    EventRevisionStatus:
      type: string
      enum: [proposed, applied, superseded]
    EventRevisionDecisionChoice:
      type: string
      enum: [approved, declined]
    EventRevisionDecision:
      type: object
      required: [decision, decided_at]
      properties:
        decision: {$ref: '#/components/schemas/EventRevisionDecisionChoice'}
        decided_at: {type: string, format: date-time}
    StandLayout:
      type: object
      required: [stand_id, code, x, y, width, height, rotation]
      properties:
        stand_id: {type: string, format: uuid}
        block_id: {type: string, format: uuid}
        code: {type: string, minLength: 1, maxLength: 12, description: Unik per acara tanpa membedakan huruf besar kecil.}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1, description: Lebar sebelum rotasi; rotasi 90 menukar lebar dan tinggi di grid.}
        height: {type: integer, minimum: 1}
        rotation: {type: integer, enum: [0, 90]}
        category_ids: {type: array, items: {type: string, format: uuid}, description: Kosong berarti semua kategori boleh.}
        facilities: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 120}}
        active: {type: boolean}
    LayoutBlock:
      type: object
      required: [id, label, x, y, width, height]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, minLength: 1, maxLength: 40}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    LayoutArea:
      type: object
      required: [kind, x, y, width, height]
      properties:
        kind: {type: string, enum: [walkway, entrance, stage, restricted]}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
    LayoutRevision:
      type: object
      required: [event_id, revision, width, height, cell_meters, blocks, stands, areas]
      properties:
        event_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 0, description: 0 berarti acara belum punya denah tersimpan.}
        width: {type: integer, minimum: 4, maximum: 60}
        height: {type: integer, minimum: 4, maximum: 60}
        cell_meters: {type: number, minimum: 0.5, maximum: 10, description: Ukuran nyata satu petak dalam meter.}
        blocks: {type: array, items: {$ref: '#/components/schemas/LayoutBlock'}}
        stands: {type: array, items: {$ref: '#/components/schemas/StandLayout'}}
        areas: {type: array, items: {$ref: '#/components/schemas/LayoutArea'}}
    LayoutRevisionInput:
      type: object
      required: [width, height, cell_meters, blocks, stands, areas]
      properties:
        width: {type: integer, minimum: 4, maximum: 60}
        height: {type: integer, minimum: 4, maximum: 60}
        cell_meters: {type: number, minimum: 0.5, maximum: 10}
        blocks: {type: array, items: {$ref: '#/components/schemas/LayoutBlock'}}
        stands: {type: array, items: {$ref: '#/components/schemas/StandLayout'}}
        areas: {type: array, items: {$ref: '#/components/schemas/LayoutArea'}}
    PublicStand:
      allOf:
      - {$ref: '#/components/schemas/StandLayout'}
      - type: object
        required: [status]
        properties:
          status:
            type: string
            enum: [available, booked, unavailable]
            description: booked untuk reservasi; unavailable untuk stand nonaktif atau sedang di-hold.
          base_price: {$ref: '#/components/schemas/Rupiah'}
    PublicLayout:
      type: object
      required: [event_id, event_name, event_slot_id, revision, width, height, cell_meters, blocks, stands, areas]
      properties:
        event_id: {type: string, format: uuid}
        event_name: {type: string}
        event_slot_id: {type: [string, 'null'], format: uuid, description: Slot yang dipakai untuk harga dan ketersediaan. Null jika semua slot berakhir.}
        revision: {type: integer, minimum: 1}
        width: {type: integer, minimum: 4, maximum: 60}
        height: {type: integer, minimum: 4, maximum: 60}
        cell_meters: {type: number, minimum: 0.5, maximum: 10}
        blocks: {type: array, items: {$ref: '#/components/schemas/LayoutBlock'}}
        stands: {type: array, items: {$ref: '#/components/schemas/PublicStand'}}
        areas: {type: array, items: {$ref: '#/components/schemas/LayoutArea'}}
    StandPrice:
      type: object
      required: [stand_id, base_price]
      properties:
        stand_id: {type: string, format: uuid}
        base_price: {$ref: '#/components/schemas/PricingRupiah'}
    BlockPrice:
      type: object
      required: [block_id, base_price]
      properties:
        block_id: {type: string, format: uuid}
        base_price: {$ref: '#/components/schemas/PricingRupiah'}
    OccupancyTier:
      type: object
      required: [occupancy_bps, multiplier_bps]
      properties:
        occupancy_bps: {$ref: '#/components/schemas/BasisPoints'}
        multiplier_bps: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
    CategoryQuota:
      type: object
