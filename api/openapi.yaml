openapi: 3.1.0
info:
  title: TenantKu API
  version: 0.1.0
  description: Kontrak HTTP TenantKu mengikuti PRD §14. Endpoint [Rencana] sudah memiliki rancangan kontrak untuk review FE dan
    BE. Detail berlabel usulan dapat berubah sebelum implementasi. Endpoint operasional dan akun yang tersedia ditandai terimplementasi.
    Mutasi akun dari browser wajib berasal dari APP_ORIGIN; gunakan origin yang sama jika mencoba mutasi lewat Scalar pada lingkungan
    pengembangan.
servers:
- url: /api/v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Account'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
  /auth/login:
    post:
      operationId: login
      summary: Start a session and set access and refresh cookies
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: Akun dan cookie sesi
          headers:
            Set-Cookie:
              description: Dua header terpisah untuk tenantku_access dan tenantku_refresh.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
      description: Berhasil mengirim dua cookie host-only HttpOnly. Cookie dikirim menggunakan Secure pada origin HTTPS.
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate session cookies
      security:
      - RefreshCookie: []
      responses:
        '200':
          description: Akun dan cookie sesi
          headers:
            Set-Cookie:
              description: Dua header terpisah untuk tenantku_access dan tenantku_refresh.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountResponse'}
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
      description: Berhasil mengirim dua cookie host-only HttpOnly. Cookie dikirim menggunakan Secure pada origin HTTPS.
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear cookies
      responses:
        '204':
          description: The session has ended or was already absent
        default:
          $ref: '#/components/responses/Error'
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas mutasi sesi terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
  /me:
    get:
      operationId: getCurrentAccount
      summary: Read the signed-in account
      security:
      - AccessCookie: []
      responses:
        '200':
          $ref: '#/components/responses/AccountProfile'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      tags: [Akun dan sesi]
      x-implementation-status: implemented
      description: Mengembalikan ID, email, serta membership usaha dan organisasi dari akun aktif.
  /healthz:
    get:
      tags: [Operasional]
      operationId: getLiveness
      summary: Periksa liveness
      description: Status layanan untuk pemeriksaan operasional.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Periksa liveness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
      servers:
      - url: /
  /readyz:
    get:
      tags: [Operasional]
      operationId: getReadiness
      summary: Periksa readiness
      description: Status layanan untuk pemeriksaan operasional.
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Periksa readiness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ready]}
        '503':
          description: PostgreSQL atau migration belum siap
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [unavailable]}
      servers:
      - url: /
  /auth/forgot-password:
    post:
      tags: [Akun dan sesi]
      operationId: requestPasswordReset
      summary: Minta tautan reset kata sandi
      description: Selalu 202 untuk email yang valid, terdaftar atau tidak. Tautan berlaku 30 menit dan sekali pakai; permintaan
        baru menggantikan tautan lama. Permintaan berulang untuk akun yang sama dalam 1 menit tidak mengirim email baru.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordInput'}
      responses:
        '202':
          description: Permintaan diterima tanpa isi respons
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas percobaan terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /auth/reset-password:
    post:
      tags: [Akun dan sesi]
      operationId: resetPassword
      summary: Atur ulang kata sandi dengan token
      description: Token sekali pakai dan berlaku 30 menit. Setelah berhasil, semua sesi akun dicabut dan cookie dihapus; pengguna
        harus masuk kembali. Token tidak valid, kedaluwarsa, atau sudah dipakai menghasilkan 422 INVALID_TOKEN.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordInput'}
      responses:
        '204':
          description: Kata sandi diganti dan semua sesi dicabut
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas percobaan terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /auth/verify-email:
    post:
      tags: [Akun dan sesi]
      operationId: verifyEmail
      summary: Verifikasi email dengan token
      description: Token sekali pakai dan berlaku 24 jam. Token tidak valid, kedaluwarsa, atau sudah dipakai menghasilkan 422
        INVALID_TOKEN. Tidak memerlukan sesi.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailInput'}
      responses:
        '204':
          description: Email terverifikasi
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas percobaan terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /auth/resend-verification:
    post:
      tags: [Akun dan sesi]
      operationId: resendEmailVerification
      summary: Kirim ulang email verifikasi
      description: Selalu 202 untuk email yang valid, terdaftar atau tidak, sudah terverifikasi atau belum. Tautan lama diganti.
        Permintaan berulang dalam 1 menit tidak mengirim email baru.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordInput'}
      responses:
        '202':
          description: Permintaan diterima tanpa isi respons
        '403':
          description: Origin browser berbeda dari APP_ORIGIN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas percobaan terlampaui
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Layanan akun belum tersedia
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /business-categories:
    get:
      tags: [Akun dan sesi]
      operationId: listBusinessCategories
      summary: 'Daftar kategori usaha'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BusinessCategory'}}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /businesses:
    post:
      tags: [Akun dan sesi]
      operationId: createBusiness
      summary: 'Buat usaha'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      description: Pemilik pertama diambil dari sesi dan dicatat dalam transaksi yang sama.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessCreate'}
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Business'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /organizations:
    post:
      tags: [Akun dan sesi]
      operationId: createOrganization
      summary: 'Buat organisasi'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      description: Organisasi baru berstatus unverified dan pembuatnya menjadi pemilik.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationInput'}
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Organization'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /organizations/{id}:
    get:
      tags: [Akun dan sesi]
      operationId: getOrganization
      summary: 'Lihat organisasi'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      parameters:
      - {$ref: '#/components/parameters/IdentityResourceID'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Organization'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Akun dan sesi]
      operationId: updateOrganization
      summary: 'Ubah profil organisasi'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      description: Hanya pemilik organisasi.
      parameters:
      - {$ref: '#/components/parameters/IdentityResourceID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationInput'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Organization'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /businesses/{id}:
    get:
      tags: [Akun dan sesi]
      operationId: getBusiness
      summary: 'Lihat profil usaha'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      parameters:
      - {$ref: '#/components/parameters/IdentityResourceID'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Business'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Akun dan sesi]
      operationId: updateBusiness
      summary: 'Ubah profil usaha'
      description: Hanya pemilik usaha.
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BusinessUpdate'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Business'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /businesses/{id}/consents:
    get:
      tags: [Akun dan sesi]
      operationId: listBusinessConsents
      summary: 'Lihat riwayat persetujuan'
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      description: Hanya pemilik usaha. Maksimal 100 peristiwa, dari yang terbaru.
      parameters:
      - {$ref: '#/components/parameters/IdentityResourceID'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ConsentEvent'}}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Akun dan sesi]
      operationId: recordConsent
      summary: 'Catat persetujuan data'
      description: Pemilik usaha. Grant dan revoke membuat entri audit baru.
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentInput'}
      responses:
        '201':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ConsentEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events:
    get:
      tags: [Acara dan katalog]
      operationId: listEvents
      summary: '[Rencana] Daftar acara publik'
      description: Katalog published/live. Filter slug merupakan pencocokan persis.
      x-implementation-status: planned
      security: []
      parameters:
      - name: slug
        in: query
        required: false
        schema: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
      - name: city
        in: query
        required: false
        schema: {type: string, minLength: 1}
      - name: category_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: starts_from
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: ends_before
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: status
        in: query
        required: false
        schema: {type: string, enum: [published, live]}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PublicEvent'}}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
  /events/{id}:
    get:
      tags: [Acara dan katalog]
      operationId: getEvent
      summary: '[Rencana] Detail acara publik'
      description: Draft dan data privat tidak ikut dipublikasikan.
      x-implementation-status: planned
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/PublicEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Acara dan katalog]
      operationId: updateEvent
      summary: Ubah draft acara
      description: Pemilik organisasi dapat mengubah draft. Perubahan jadwal memperbarui slot seluruh acara.
      x-implementation-status: implemented
      security:
      - AccessCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdate'}
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ManagedEvent'}
                  meta: {$ref: '#/components/schemas/EmptyMeta'}
        '401':
          description: Sesi pengguna atau tanda tangan provider tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
