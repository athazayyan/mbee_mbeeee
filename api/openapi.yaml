      summary: '[Rencana] Buat hold stand'
      description: Pemilik usaha meminta hold. Inventori dan kuota dikunci, harga dihitung server, dan jika expected_price diisi, seluruh komponen harga diverifikasi ulang. Percobaan ulang dengan kunci serta isi yang sama mengembalikan status booking terkini.
      x-implementation-status: planned
      security:
      - AccessCookie: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoldInput'}
            example:
              business_id: 10101010-1010-4010-8010-000000000001
              event_id: 10101010-1010-4010-8010-000000000002
              stand_id: 10101010-1010-4010-8010-000000000003
              event_slot_id: 10101010-1010-4010-8010-000000000004
              accepted_policy_version: refund-v1
      responses:
        '200':
          description: Hasil booking terkini untuk pengulangan idempoten
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingWithServerTime'}
        '201':
          description: Hold baru dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingWithServerTime'}
              example:
                data:
                  booking_id: 10101010-1010-4010-8010-000000000005
                  business_id: 10101010-1010-4010-8010-000000000001
                  event_id: 10101010-1010-4010-8010-000000000002
                  event_name: Pasar TenantKu
                  stand_id: 10101010-1010-4010-8010-000000000003
                  event_slot_id: 10101010-1010-4010-8010-000000000004
                  status: held
                  accepted_policy_version: refund-v1
                  created_at: '2026-12-01T03:00:00Z'
                  expires_at: '2026-12-01T03:15:00Z'
                  price:
                    currency: IDR
                    rent: 500000
                    platform_fee: 0
                    provider_fee: 0
                    total: 500000
                    price_version: '1'
                meta:
                  server_now: '2026-12-01T03:00:00Z'
        '400':
          description: Request atau header tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Sesi pengguna tidak valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Akses atau aksi tidak diizinkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource tidak ditemukan atau tidak terlihat oleh pemanggil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: EVENT_NOT_BOOKABLE, STAND_UNAVAILABLE, CATEGORY_QUOTA_FULL, REFUND_POLICY_CHANGED, HOLD_PRICE_CHANGED, atau IDEMPOTENCY_PAYLOAD_MISMATCH
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Isi request gagal divalidasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Batas hold aktif tercapai (HOLD_LIMIT_REACHED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
