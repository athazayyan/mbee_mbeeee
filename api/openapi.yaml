        event_id: {type: string, format: uuid}
    PosSession:
      type: object
      required: [id, business_id, device_id, opened_at, status]
      properties:
        id: {type: string, format: uuid}
        business_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
